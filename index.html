<!--
==================================================================================================
  ULTRAMED OCUPACIONAL — DIAGNÓSTICO GRATUITO DE CONFORMIDADE EM SST
  Arquivo único (HTML + CSS + JS). Sem build e sem dependências externas.
==================================================================================================

  ONDE EDITAR — tudo fica no objeto CONFIG, no início do <script>, lá embaixo:

  1) WHATSAPP ........ CONFIG.empresa.whatsapp  → só dígitos: 55 + DDD + número (ex.: "5532999002140").
                       Atenção: o mesmo número aparece também no bloco <noscript> (procure "wa.me").
  2) META PIXEL ...... CONFIG.rastreamento.metaPixelId → ID do pixel/conjunto de dados. Vazio = desligado.
                       Eventos enviados: PageView (abrir), filtro-empresa (resposta do filtro:
                       "empresa" ou "pessoa_fisica"), InicioDiagnostico (é empresa, começou),
                       Lead (enviar o formulário) e Contact (clicar no WhatsApp).
                       O mesmo ID aparece no <noscript> (procure "facebook.com/tr").
  3) WEBHOOK/CRM ..... CONFIG.rastreamento.webhookUrl → URL do Make, n8n, Kommo etc. Vazio = desligado.
                       Envia os campos do lead, score, pendências, UTMs e fbp/fbc. Se falhar, a
                       experiência do usuário NÃO é afetada (o WhatsApp continua funcionando).
                       Para pedir também WhatsApp e e-mail no formulário: CONFIG.formulario.pedirContato.
  4) GOOGLE TAG MANAGER (opcional) .. CONFIG.rastreamento.gtmId → "GTM-XXXXXXX".
  5) CORES ........... CONFIG.marca (verde, verdeEscuro, azul). As demais cores ficam no :root do <style>.
  6) LOGO ............ CONFIG.empresa.logoUrl → nome do arquivo de imagem colocado na mesma pasta
                       (ex.: "logo-ultramed.png"). Vazio = logo em texto.
  7) LGPD ............ CONFIG.empresa.politicaPrivacidadeUrl e CONFIG.empresa.cnpj (aparecem no
                       consentimento e no rodapé). A política fica em politica-de-privacidade.html,
                       que deve ser publicado junto com este arquivo.
  8) PERGUNTAS ....... CONFIG.blocos → cada pergunta tem texto, peso, opções (valor 1 = em dia,
                       0.5 = parcial, 0 = não/não sei) e a pendência que aparece no resultado.
                       "mostrarSe" controla quando a pergunta/bloco aparece (porte, setor etc.).
  9) PRAZO NR-01 ..... CONFIG.nr01.dataFiscalizacao. Os textos mudam sozinhos de "a partir de"
                       para "desde" quando a data passa.
  10) FILTRO ........ CONFIG.filtro (textos da tela "é empresa?") e CONFIG.empresa.instagramUrl
                       (para onde vai quem responde "Não").

  COMO PUBLICAR EM https://ultramed.tribuzz.com.br/
  1) Netlify (app.netlify.com/drop): arraste a pasta com index.html + politica-de-privacidade.html.
  2) No site criado: Domain management → Add a domain → ultramed.tribuzz.com.br
  3) Registro.br → tribuzz.com.br → Configurar zona DNS → Nova entrada:
     CNAME | ultramed | <nome-do-site>.netlify.app  → Salvar alterações.
  Para atualizar depois: no Netlify, aba Deploys, arraste a pasta de novo.
  Detalhes e checklist antes de anunciar: veja o README.md.

  AVISO: diagnóstico preliminar e orientativo. Não é auditoria legal nem consultoria jurídica.
==================================================================================================
-->

<style>
  /* ============================ TOKENS (cores, raios, fontes) ============================ */
  :root{
    color-scheme: light;
    --verde:        #00853b;   /* verde da logo (levemente escurecido: contraste AA com texto branco) */
    --verde-escuro: #205830;   /* verde-escuro da logo */
    --verde-suave:  #e7f4ea;
    --verde-linha:  #b7dcc0;
    --azul:         #1d4e6b;
    --azul-suave:   #e9f1f6;

    --fundo:        #f4f7f5;   /* neutro com leve viés verde */
    --superficie:   #ffffff;
    --texto:        #13221d;
    --texto-suave:  #4a5d57;
    --borda:        #d5e3d9;

    /* semáforo (separado da cor da marca) */
    --ok:            #1a7f4e;  --ok-suave:      #e3f3ea;
    --atencao:       #9a5b00;  --atencao-suave: #fdf0d9;  --atencao-linha: #f1d39c;
    --critico:       #b3261e;  --critico-suave: #fbe8e6;

    --whats:        #009040;   /* verde da logo no botão de WhatsApp (texto branco grande, contraste AA) */
    --whats-escuro: #00733a;

    --raio: 14px;
    --raio-sm: 10px;
    --max: 600px;
    --sombra: 0 1px 2px rgba(19,34,29,.06), 0 8px 24px rgba(19,34,29,.06);
    --fonte: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ============================ BASE ============================ */
  *, *::before, *::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background:var(--fundo); color:var(--texto);
    font:400 1rem/1.55 var(--fonte);
    -webkit-font-smoothing:antialiased;
  }
  main{ flex:1; }
  h1, h2, h3{ margin:0; line-height:1.2; letter-spacing:-.01em; text-wrap:balance; }
  p{ margin:0; }
  a{ color:var(--azul); }
  img{ max-width:100%; height:auto; }
  button, input{ font:inherit; }
  :focus-visible{ outline:3px solid var(--azul); outline-offset:2px; }
  [data-foco]:focus{ outline:none; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .rotulo{ font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--texto-suave); }

  /* ============================ CABEÇALHO ============================ */
  .topo{ position:sticky; top:0; z-index:10; background:var(--superficie); border-bottom:1px solid var(--borda); }
  .topo-inner{ max-width:var(--max); margin:0 auto; padding:10px 16px; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo{ display:inline-flex; align-items:center; gap:10px; color:var(--verde-escuro); font-weight:800; font-size:1.0625rem; letter-spacing:-.01em; }
  .logo img{ display:block; height:44px; width:auto; }
  .logo-marca{ width:30px; height:30px; border-radius:8px; background:var(--verde); display:grid; place-items:center; flex:none; }
  .logo-texto small{ display:block; font-size:.625rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-suave); }
  .topo-tag{ font-size:.75rem; font-weight:700; color:var(--verde-escuro); background:var(--verde-suave); padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .progresso{ height:4px; background:var(--verde-suave); }
  .progresso span{ display:block; height:100%; width:0; background:var(--verde); transition:width .35s ease; }

  /* ============================ ESTRUTURA ============================ */
  .container{ width:100%; max-width:var(--max); margin:0 auto; padding:20px 16px 32px; }
  .tela{ display:flex; flex-direction:column; gap:20px; animation:entra .3s ease-out both; }
  @keyframes entra{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .cartao{ background:var(--superficie); border:1px solid var(--borda); border-radius:var(--raio); box-shadow:var(--sombra); padding:20px; }
  @media (min-width:480px){ .cartao{ padding:28px; } }

  /* ============================ BOTÕES ============================ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    min-height:52px; padding:12px 22px; border:0; border-radius:12px;
    font-weight:700; font-size:1rem; line-height:1.2; text-align:center; text-decoration:none; cursor:pointer;
    transition:background-color .15s ease, transform .1s ease, box-shadow .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:translateY(1px); }

   ================================================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c=>({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function getPerfil(){
  const r = estado.respostas;
  return { funcionarios:r.funcionarios, setor:r.setor };
}
function textoDe(v){ return typeof v === "function" ? v(getPerfil(), estado.respostas) : v; }
function menosMovimento(){ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
function gerarId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function primeiroNome(nome){ return String(nome || "").trim().split(/\s+/)[0] || ""; }
function dataBR(iso){ const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }

/* Rótulo legível de uma opção (ex.: setor "industria" → "Indústria") */
function rotuloOpcao(idPergunta, chave){
  for(const b of CONFIG.blocos) for(const q of b.perguntas){
    if(q.id !== idPergunta) continue;
    for(const o of q.opcoes) if(o.chave === chave) return o.rotulo;
  }
  return chave || "";
}

/* Origem do acesso (UTMs do anúncio, fbclid/gclid) — guardada para o webhook */
function capturarOrigem(){
  const o = {};
  try{
    const p = new URLSearchParams(location.search);
    ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","utm_id","fbclid","gclid"].forEach(k=>{
      const v = p.get(k); if(v) o[k] = v;
    });
  }catch(e){}
  return o;
}
function lerCookie(nome){
  const m = document.cookie.match(new RegExp("(?:^|; )" + nome + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}

/* Telefone: mantém só dígitos, remove o 55 se vier junto, limita a 11 */
function digitosTelefone(v){
  let d = String(v || "").replace(/\D/g, "");
  if(d.length > 11 && d.indexOf("55") === 0) d = d.slice(2);
  return d.slice(0, 11);
}
function formatarTelefone(d){
  if(!d) return "";
  if(d.length <= 2) return "(" + d;
  const ddd = d.slice(0, 2), resto = d.slice(2);
  if(resto.length <= 4) return "(" + ddd + ") " + resto;
  if(resto.length <= 8) return "(" + ddd + ") " + resto.slice(0, 4) + "-" + resto.slice(4);
  return "(" + ddd + ") " + resto.slice(0, 5) + "-" + resto.slice(5);
}

/* ==================================================================================================
   ETAPAS E PERGUNTAS VISÍVEIS (respeitam porte, setor e respostas anteriores)
   ================================================================================================== */
function blocosVisiveis(){
  const perfil = getPerfil(), r = estado.respostas;
  const lista = [];
  CONFIG.blocos.forEach(b=>{
    if(b.mostrarSe && !b.mostrarSe(perfil, r)) return;
    const perguntas = b.perguntas.filter(q=> !q.mostrarSe || q.mostrarSe(perfil, r));
    if(perguntas.length) lista.push({ bloco:b, perguntas:perguntas });
  });
  return lista;
}
/* Páginas do questionário: blocos seguidos com a mesma "etapa" ficam na mesma página */
function etapasVisiveis(){
  const etapas = [];
  blocosVisiveis().forEach(item=>{
    const titulo = item.bloco.etapa || item.bloco.titulo;
    let atual = etapas[etapas.length - 1];
    if(!atual || atual.titulo !== titulo){ atual = { titulo:titulo, perguntas:[] }; etapas.push(atual); }
    item.perguntas.forEach(q=> atual.perguntas.push({ q:q, bloco:item.bloco }));
  });
  return etapas;
}
function perguntasVisiveis(){
  const lista = [];
  etapasVisiveis().forEach(e=> e.perguntas.forEach(it=> lista.push(it)));
  return lista;
}
function etapaCompleta(etapa){ return etapa.perguntas.every(it=> estado.respostas[it.q.id] !== undefined); }
function primeiraEtapaIncompleta(){
  const etapas = etapasVisiveis();
  for(let i = 0; i < etapas.length; i++) if(!etapaCompleta(etapas[i])) return i;
  return -1;
}
/* Muda quando uma resposta mostra/esconde perguntas ou troca textos na página atual */
function assinaturaEtapa(){
  const etapas = etapasVisiveis(), e = etapas[estado.indice];
  return etapas.length + "|" + (e ? e.perguntas.map(it=> it.q.id + ":" + textoDe(it.q.texto)).join("|") : "");
}

/* ==================================================================================================
   NAVEGAÇÃO (integrada ao botão "voltar" do celular/navegador)
   Telas: hero → filtro → pergunta (uma página por etapa) → captura → resultado
   ================================================================================================== */
function irPara(tela, indice){
  estado.tela = tela;
  estado.indice = indice || 0;
  if(historicoOk){
    try{ history.pushState({ tela:tela, indice:estado.indice }, ""); }catch(e){}
  }
  render(true);
}
function voltar(){
  if(historicoOk) { history.back(); return; }
  if(estado.tela === "captura") return irPara("pergunta", etapasVisiveis().length - 1);
  if(estado.tela === "pergunta" && estado.indice > 0) return irPara("pergunta", estado.indice - 1);
  if(estado.tela === "pergunta") return irPara("filtro");
  irPara("hero");
}
window.addEventListener("popstate", (e)=>{
  const s = e.state;
  if(s && s.tela){ estado.tela = s.tela; estado.indice = s.indice || 0; }
  else { estado.tela = "hero"; estado.indice = 0; }
  render(true);
});
function avancar(){
  const total = etapasVisiveis().length;
  if(estado.indice >= total - 1) irPara("captura");
  else irPara("pergunta", estado.indice + 1);
}

/* ==================================================================================================
   RENDERIZAÇÃO
   ================================================================================================== */
const TELAS_DO_DIAGNOSTICO = ["pergunta", "captura", "resultado"];
function render(moverFoco){
  // Proteções: só empresas entram no diagnóstico; não pula etapas incompletas;
  // não mostra resultado sem o formulário enviado
  if(TELAS_DO_DIAGNOSTICO.indexOf(estado.tela) >= 0 && estado.filtro !== "empresa"){ estado.tela = "filtro"; estado.indice = 0; }
  if(TELAS_DO_DIAGNOSTICO.indexOf(estado.tela) >= 0){
    const pi = primeiraEtapaIncompleta();
    if(pi >= 0 && (estado.tela !== "pergunta" || estado.indice > pi)){ estado.tela = "pergunta"; estado.indice = pi; }
  }
  if(estado.tela === "pergunta") estado.indice = Math.min(estado.indice, Math.max(0, etapasVisiveis().length - 1));
  if(estado.tela === "resultado" && !estado.lead) estado.tela = "captura";

  document.body.setAttribute("data-tela", estado.tela);
  if(observadorCta){ observadorCta.disconnect(); observadorCta = null; }
  $ctaFixo.hidden = true;
  $ctaFixo.classList.remove("visivel");

  atualizarProgresso();
  window.scrollTo(0, 0);

  if(estado.tela === "hero") renderHero();
  else if(estado.tela === "filtro") renderFiltro();
  else if(estado.tela === "pergunta") renderEtapa();
  else if(estado.tela === "captura") renderCaptura();
  else renderResultado();

  // Acessibilidade: leva o foco ao título da nova tela
  if(moverFoco){
    const alvo = $app.querySelector("[data-foco]");
    if(alvo){ try{ alvo.focus({ preventScroll:true }); }catch(e){ alvo.focus(); } }
  }
}

function atualizarProgresso(){
  if(estado.tela === "hero"){ $progresso.hidden = true; return; }
  $progresso.hidden = false;
  const total = etapasVisiveis().length + 2;   // filtro + etapas + formulário
  const atual = estado.tela === "filtro" ? 0
    : estado.tela === "pergunta" ? 1 + estado.indice
    : estado.tela === "captura" ? total - 1 : total;
  const pct = Math.round(atual / total * 100);
  $barra.style.width = pct + "%";
  $progresso.setAttribute("aria-valuenow", String(pct));
}

let redirecionando = false;
function escolherFiltro(resposta){
  if(redirecionando) return;
  rastrear("filtro-empresa", { resposta:resposta });

  if(resposta === "empresa"){
    estado.filtro = "empresa";
    if(!estado.inicioRastreado){ estado.inicioRastreado = true; rastrear("inicio", {}); }
    irPara("pergunta", 0);
    return;
  }

  // Não é empresa: avisa e leva ao Instagram da Ultramed. A espera curta garante que o evento
  // "filtro-empresa" chegue à Meta antes de a página ser trocada.
  estado.filtro = "pessoa_fisica";
  redirecionando = true;
  const insta = CONFIG.empresa.instagramUrl;
  const destino = insta || CONFIG.empresa.site;
  const mensagem = CONFIG.filtro.mensagemNao.replace("Instagram", insta ? "Instagram" : "site");
  document.getElementById("cartaoFiltro").innerHTML = `

      <h1 class="pergunta-titulo" tabindex="-1">Obrigado pelo interesse!</h1>
      <p class="ajuda">${esc(mensagem)}</p>
      <p class="ajuda"><a href="${esc(destino)}">Ir agora</a></p>
    </div>`;
  setTimeout(()=> navegarPara(destino), 900);
}

/* ---------- TELA 3: ETAPA DO QUESTIONÁRIO (várias perguntas na mesma página) ---------- */
function renderEtapa(opcoes){
  opcoes = opcoes || {};
  const etapas = etapasVisiveis();
  const etapa = etapas[estado.indice];
  const ultima = estado.indice === etapas.length - 1;
  const r = estado.respostas;

  $app.innerHTML = `
    <section class="tela${opcoes.semAnimacao ? " sem-animacao" : ""}">
      <form class="cartao pergunta etapa-pagina" id="formEtapa" novalidate>
        <div class="etapa-topo">
          <p class="etapa">Etapa ${estado.indice + 1} de ${etapas.length}</p>
          <h1 class="pergunta-titulo" id="tituloEtapa" tabindex="-1" data-foco>${esc(etapa.titulo)}</h1>
        </div>
        ${etapa.perguntas.map(it=>{
          const q = it.q, ajuda = textoDe(q.ajuda), resp = r[q.id], id = esc(q.id);
          return `
        <fieldset class="q" data-q="${id}"${ajuda ? ` aria-describedby="ajuda-${id}"` : ""}>
          <legend class="q-texto">${esc(textoDe(q.texto))}</legend>
          ${ajuda ? `<p class="q-ajuda" id="ajuda-${id}">${esc(ajuda)}</p>` : ""}
          <div class="op-lista">
            ${q.opcoes.map(op=> `<label class="pil"><input type="radio" name="${id}" value="${esc(op.chave)}"${resp === op.chave ? " checked" : ""}><span>${esc(op.rotulo)}</span></label>`).join("")}
          </div>
          <p class="q-erro" id="erro-${id}"></p>
        </fieldset>`; }).join("")}
        <p class="sr-only" id="avisoEtapa" aria-live="polite"></p>
        <div class="nav">
          <button type="button" class="btn btn-voltar" id="btnVoltar"><span aria-hidden="true">←</span><span class="sr-only">Voltar</span></button>
          <button type="submit" class="btn btn-primario" id="btnProxima">${ultima ? "Continuar" : "Próxima"}</button>
        </div>
      </form>
    </section>`;

  const form = document.getElementById("formEtapa");
  const assinatura = assinaturaEtapa();

  // Ao tocar numa resposta, a página rola até a próxima pergunta sem resposta (pelo teclado, não)
  let viaPonteiro = false;
  ["pointerdown", "touchstart", "mousedown"].forEach(ev=> form.addEventListener(ev, ()=>{ viaPonteiro = true; }, { passive:true }));
  form.addEventListener("keydown", ()=>{ viaPonteiro = false; });

  form.addEventListener("change", (e)=>{
    const input = e.target;
    if(input.type !== "radio") return;
    estado.respostas[input.name] = input.value;
    const fs = input.closest(".q");
    fs.classList.remove("faltando");
    document.getElementById("erro-" + input.name).textContent = "";
    const toque = viaPonteiro; viaPonteiro = false;

    // A resposta mostrou/escondeu perguntas ou mudou textos (ex.: exposição → LTCAT): redesenha no lugar
    if(assinaturaEtapa() !== assinatura){
      const y = window.scrollY;
      renderEtapa({ semAnimacao:true });
      window.scrollTo(0, y);
      if(toque) rolarParaPendente(input.name);
      else {
        const igual = Array.prototype.filter.call($app.querySelectorAll('input[name="' + input.name + '"]'), i=> i.value === input.value)[0];
        if(igual) igual.focus();
      }
      return;
    }
    if(toque) rolarParaPendente(input.name);
  });

  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const faltando = etapasVisiveis()[estado.indice].perguntas.filter(it=> estado.respostas[it.q.id] === undefined);
    if(!faltando.length){ avancar(); return; }
    faltando.forEach(it=>{
      form.querySelector('.q[data-q="' + it.q.id + '"]').classList.add("faltando");
      document.getElementById("erro-" + it.q.id).textContent = "Escolha uma opção.";
    });
    document.getElementById("avisoEtapa").textContent = faltando.length === 1 ? "Falta responder 1 pergunta." : "Faltam " + faltando.length + " perguntas.";
    const primeiro = form.querySelector('.q[data-q="' + faltando[0].q.id + '"]');
    const inp = primeiro.querySelector("input");
    if(inp){ try{ inp.focus({ preventScroll:true }); }catch(err){} }
    primeiro.scrollIntoView({ behavior: menosMovimento() ? "auto" : "smooth", block:"center" });
  });
  document.getElementById("btnVoltar").addEventListener("click", voltar);
}

/* Depois de uma resposta por toque: rola até a próxima pergunta sem resposta (ou até o botão) */
function rolarParaPendente(nomeAtual){
  const campos = Array.prototype.slice.call($app.querySelectorAll(".q"));
  const pos = campos.findIndex(f=> f.getAttribute("data-q") === nomeAtual);
  const pendentes = campos.filter(f=> estado.respostas[f.getAttribute("data-q")] === undefined);
  const alvo = pendentes.filter(f=> campos.indexOf(f) > pos)[0] || pendentes[0] || document.getElementById("btnProxima");
  if(!alvo) return;
  setTimeout(()=> alvo.scrollIntoView({ behavior: menosMovimento() ? "auto" : "smooth", block:"nearest" }), menosMovimento() ? 0 : 160);
}

function validarCaptura(form){
  const pedeContato = !!CONFIG.formulario.pedirContato;
  const campos = pedeContato ? ["nome", "empresa", "whatsapp", "email", "consentimento"] : ["nome", "empresa", "consentimento"];

    telefone: pedeContato ? digitosTelefone(form.whatsapp.value) : "",
    email: pedeContato ? form.email.value.trim().toLowerCase() : "",
    consentimento: form.consentimento.checked,
  };
  const erros = {};
  if(v.nome.length < 2) erros.nome = "Informe seu nome.";
  if(v.empresa.length < 2) erros.empresa = "Informe o nome da empresa.";
  if(pedeContato){
    if(!(v.telefone.length === 10 || v.telefone.length === 11) || v.telefone[0] === "0")
      erros.whatsapp = "Digite o WhatsApp com DDD, por exemplo (32) 99999-9999.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)) erros.email = "Digite um e-mail válido, por exemplo nome@empresa.com.br.";
  }
  if(!v.consentimento) erros.consentimento = "Para ver o resultado, marque a autorização de uso dos dados.";

  campos.forEach(campo=>{
    const msg = erros[campo] || "";
    document.getElementById("erro-" + campo).textContent = msg;
    form[campo].setAttribute("aria-invalid", msg ? "true" : "false");
  });
  document.getElementById("caixaConsentimento").classList.toggle("invalido", !!erros.consentimento);

  const primeiro = campos.filter(c=> erros[c])[0];
  if(primeiro){ form[primeiro].focus(); return null; }
  return v;
}

function enviarCaptura(form){
  const v = validarCaptura(form);
  if(!v) return;
  const btn = document.getElementById("btnVer");
  btn.disabled = true;
  btn.textContent = "Gerando diagnóstico…";

  estado.lead = {
    nome: v.nome, empresa: v.empresa, telefone: v.telefone, email: v.email,
    consentimentoEm: new Date().toISOString(),
    robo: !!form.site.value,
  };
  estado.leadId = gerarId();
  estado.resultado = calcularResultado();

  // >>> Integrações: cada uma isolada, nenhuma bloqueia a navegação <<<
  const chave = [v.nome, v.empresa, v.email, v.telefone].join("|").toLowerCase();
  const repetido = estado.leadsRastreados.indexOf(chave) >= 0;
  if(!repetido){ estado.leadsRastreados.push(chave); rastrear("lead", dadosDoEvento()); }
  enviarWebhook(repetido ? "diagnostico_refeito" : "lead");

  irPara("resultado");
}

/* ==================================================================================================
   CÁLCULO DO DIAGNÓSTICO
   ================================================================================================== */
function calcularResultado(){
  const perfil = getPerfil(), r = estado.respostas;
  const lista = perguntasVisiveis();
  const respostas = {};
  lista.forEach(it=>{ if(r[it.q.id] !== undefined) respostas[it.q.id] = r[it.q.id]; });

  if(perfil.funcionarios === "0"){
    return {
      semFuncionarios:true, score:null, faixa:null, areas:[], temPsicossocial:false, perfil:perfil, respostas:respostas,
      pendencias: CONFIG.semFuncionarios.itens.map(p=> Object.assign({ prioridade:"preparo", area:"Antes de contratar" }, p)),
    };
  }

  let somaPeso = 0, somaGanho = 0;
  const mapa = {}, ordemAreas = [], pendencias = [];
  lista.forEach(it=>{
    const q = it.q, area = it.bloco.area;
    const op = q.opcoes.filter(o=> o.chave === r[q.id])[0];
    const valor = op ? op.valor : 0;
    if(q.peso > 0){
      somaPeso += q.peso;
      somaGanho += q.peso * valor;
      if(area){
        if(!mapa[area]){ mapa[area] = { peso:0, ganho:0 }; ordemAreas.push(area); }
        mapa[area].peso += q.peso;
        mapa[area].ganho += q.peso * valor;
      }
    }
    if(typeof q.pendencia === "function"){
      const p = q.pendencia(perfil, r);
      if(p) pendencias.push(Object.assign({ area:area, idPergunta:q.id, ordem:pendencias.length }, p));
    }
  });

  const score = somaPeso > 0 ? Math.round(somaGanho / somaPeso * 100) : 0;
  const faixa = CONFIG.faixas.filter(f=> score >= f.min && score <= f.max)[0] || CONFIG.faixas[0];

  // Ordem: psicossociais, PGR e PCMSO no topo; depois prioridade alta; depois média
  const peso = (p)=> p.psicossocial ? 0 : p.idPergunta === "pgr" ? 1 : p.idPergunta === "pcmso" ? 2 : p.prioridade === "alta" ? 3 : 4;
  pendencias.sort((a, b)=> (peso(a) - peso(b)) || (a.ordem - b.ordem));

  // Semáforo: percentual da área, mas nunca verde se houver pendência de prioridade alta nela
  const areas = ordemAreas.map(nome=>{
    const a = mapa[nome];
    const pct = Math.round(a.ganho / a.peso * 100);
    let nivel = pct >= 71 ? "ok" : (pct >= 41 ? "atencao" : "critico");
    if(nivel === "ok" && pendencias.some(p=> p.area === nome && p.prioridade === "alta")) nivel = "atencao";
    return { nome:nome, pct:pct, nivel:nivel };
  });

  return {
    semFuncionarios:false, score:score, faixa:faixa, areas:areas, pendencias:pendencias,
    temPsicossocial: pendencias.some(p=> p.psicossocial), perfil:perfil, respostas:respostas,
  };
}

/* Medidor semicircular: trilho + arco proporcional ao score */
const COMPRIMENTO_ARCO = Math.PI * 86;
function gaugeSvg(score){
  return `
    <svg viewBox="0 0 200 110" aria-hidden="true" focusable="false">
      <path class="gauge-trilho" d="M14 100 A86 86 0 0 1 186 100"/>
      ${score > 0 ? `<path class="gauge-valor" id="gaugeValor" d="M14 100 A86 86 0 0 1 186 100"/>` : ""}
    </svg>`;
}
function animarGauge(score){
  const arco = document.getElementById("gaugeValor");
  const num = document.getElementById("placarNum");
  const total = COMPRIMENTO_ARCO.toFixed(2);
  const alvo = (COMPRIMENTO_ARCO * (1 - score / 100)).toFixed(2);
  if(arco){
    arco.style.strokeDasharray = total;
    arco.style.strokeDashoffset = menosMovimento() ? alvo : total;
  }
  if(menosMovimento()) return;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    if(arco) arco.style.strokeDashoffset = alvo;
  }));
  const inicio = performance.now(), duracao = 1100;
  (function passo(t){
    const p = Math.min(1, (t - inicio) / duracao);
    const suave = 1 - Math.pow(1 - p, 3);
    if(num) num.textContent = Math.round(suave * score);
    if(p < 1) requestAnimationFrame(passo);
  })(inicio);
}

/*
  Clique no WhatsApp: registra o evento Contact e abre a conversa.
  - Computador: o link abre em outra aba e esta página continua aberta, então o evento é
    enviado normalmente.
  - Celular (toque): abrir o WhatsApp tira o navegador da frente na hora e pode congelar a
    página antes de o evento chegar à Meta (principalmente no navegador interno do Instagram).
    Por isso o evento é disparado primeiro e a conversa abre 350 ms depois, na mesma aba.
*/
/*
  WhatsApp x WhatsApp Business: o link wa.me abre o app que o sistema escolher (em geral o
  WhatsApp comum). No Android dá para abrir cada app pelo pacote, então lá a pessoa escolhe:
    WhatsApp → com.whatsapp | WhatsApp Business → com.whatsapp.w4b
  (se o app escolhido não estiver instalado, o Android abre o link wa.me normal).
  No iPhone não existe um link confiável para escolher o app: segue o wa.me.
*/
const PACOTES_WHATSAPP = { whatsapp:"com.whatsapp", whatsapp_business:"com.whatsapp.w4b" };
let abrindoWhatsApp = false;

function abrirWhatsApp(e){
  const toque = !!(window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches);
  const android = /Android/i.test(navigator.userAgent);
  if(toque) e.preventDefault();
  if(toque && android){ abrirEscolhaWhatsApp(e.currentTarget); return; }

  if(!registrarContato("padrao")) return;
  if(toque){
    const url = e.currentTarget.href;
    setTimeout(()=> navegarPara(url), 350);
  }
}

/* Evento Contact (uma vez por toque) + webhook */
function registrarContato(app){
  if(abrindoWhatsApp) return false;          // evita evento duplicado em toque duplo
  abrindoWhatsApp = true;
  setTimeout(()=>{ abrindoWhatsApp = false; }, 1500);
  rastrear("whatsapp", Object.assign(dadosDoEvento(), { app:app }));
  enviarWebhook("whatsapp_click");
  return true;
}

/* Link do Android que abre um app específico, com o wa.me como alternativa */
function linkIntentWhatsApp(app){
  const R = estado.resultado;
  const numero = String(CONFIG.empresa.whatsapp).replace(/\D/g, "");
  return "intent://send/?phone=" + numero + "&text=" + encodeURIComponent(mensagemWhatsApp(R))
    + "#Intent;scheme=whatsapp;package=" + PACOTES_WHATSAPP[app]
    + ";S.browser_fallback_url=" + encodeURIComponent(linkWhatsApp(R)) + ";end";
}

/* Painel "Abrir a conversa no: WhatsApp | WhatsApp Business" (Android) */
function abrirEscolhaWhatsApp(botaoOrigem){
  fecharEscolhaWhatsApp();
  const fundo = document.createElement("div");
  fundo.className = "escolha-fundo";
  fundo.id = "escolhaWhats";
  fundo.innerHTML = `
    <div class="escolha" role="dialog" aria-modal="true" aria-labelledby="escolhaTitulo">
      <p class="escolha-titulo" id="escolhaTitulo">Abrir a conversa no:</p>
      <button type="button" class="btn btn-whats" data-app="whatsapp">${ICONE.whats}<span>WhatsApp</span></button>
      <button type="button" class="btn btn-whats-business" data-app="whatsapp_business">${ICONE.whats}<span>WhatsApp Business</span></button>
      <button type="button" class="btn btn-texto" data-app="cancelar">Cancelar</button>
    </div>`;
  document.body.appendChild(fundo);

  const fechar = ()=>{ fecharEscolhaWhatsApp(); if(botaoOrigem) botaoOrigem.focus(); };
  fundo.addEventListener("click", (ev)=>{
    if(ev.target === fundo) return fechar();
    const b = ev.target.closest("[data-app]");
    if(!b) return;
    const app = b.getAttribute("data-app");
    if(app === "cancelar") return fechar();
    if(!registrarContato(app)) return;
    const destino = linkIntentWhatsApp(app);
    setTimeout(()=>{ fecharEscolhaWhatsApp(); navegarPara(destino); }, 350);
  });
  fundo.addEventListener("keydown", (ev)=>{ if(ev.key === "Escape") fechar(); });
  fundo.querySelector("[data-app]").focus();
}
function fecharEscolhaWhatsApp(){
  const f = document.getElementById("escolhaWhats");
  if(f) f.remove();
}

/* Troca de página (separado para poder ser observado nos testes) */
function navegarPara(url){ window.location.href = url; }

/* Mensagem pré-preenchida do WhatsApp com o resumo do diagnóstico */
function mensagemWhatsApp(R){
  const L = estado.lead || {};
  const nome = primeiroNome(L.nome);
  const apresentacao = "Olá! " + (nome ? "Sou " + nome + ", da empresa " + L.empresa + ". " : "");
  if(R.semFuncionarios){
    return apresentacao + "Fiz o diagnóstico de saúde ocupacional: ainda não temos funcionários CLT e quero me preparar para as primeiras contratações. Pode me ajudar?";
  }
  const top = R.pendencias.slice(0, 3).map(p=> "• " + p.titulo).join("\n");
  return apresentacao + "Fiz o diagnóstico de saúde ocupacional.\n"
    + "Meu resultado foi " + R.score + "/100 (" + R.faixa.rotulo + ").\n"
    + (top ? "Principais pendências:\n" + top + "\n" : "Não apareceram pendências relevantes.\n")
    + "Quero uma proposta da " + CONFIG.empresa.nome + ".";
}
function linkWhatsApp(R){
  return "https://wa.me/" + String(CONFIG.empresa.whatsapp).replace(/\D/g, "") + "?text=" + encodeURIComponent(mensagemWhatsApp(R));
}

/* ==================================================================================================
   INTEGRAÇÕES — cada uma isolada e fácil de ligar/desligar pelo CONFIG.rastreamento
   ================================================================================================== */

/* Dados comuns dos eventos (sem dados pessoais — seguros para Pixel e GTM) */
function dadosDoEvento(){
  const R = estado.resultado;
  return {
    lead_id: estado.leadId,
    score: R && !R.semFuncionarios ? R.score : null,
    classificacao: R ? (R.semFuncionarios ? "Sem empregados CLT" : R.faixa.rotulo) : "",
    pendencias: R ? R.pendencias.length : 0,
  };
}

/* ---- Meta Pixel + Google Tag Manager: inicialização (PageView) ---- */
function iniciarRastreamento(){
  const cfg = CONFIG.rastreamento;
  window.dataLayer = window.dataLayer || [];

  if(cfg.gtmId){
    window.dataLayer.push({ "gtm.start": Date.now(), event:"gtm.js" });
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtm.js?id=" + encodeURIComponent(cfg.gtmId);
    document.head.appendChild(s);
  }

  if(cfg.metaPixelId){
    /* Snippet oficial do Meta Pixel */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    // A página troca de etapa com history.pushState; sem isto o Pixel contaria um PageView
    // a cada pergunta (≈20 por visita). Precisa vir antes do "init".
    window.fbq.disablePushState = true;
    try{ fbq("init", cfg.metaPixelId); fbq("track", "PageView"); }catch(e){}
  }
}

/* ---- Eventos do funil: inicio | lead | whatsapp ---- */
function rastrear(evento, dados){
  // No GTM, o filtro usa o próprio nome ("filtro-empresa"); os demais, "diagnostico_<evento>"
  try{ window.dataLayer.push(Object.assign({ event: evento === "filtro-empresa" ? evento : "diagnostico_" + evento }, dados)); }catch(e){}

  if(!CONFIG.rastreamento.metaPixelId || typeof window.fbq !== "function") return;
  try{
    if(evento === "filtro-empresa"){
      // Tela de filtro: resposta = "empresa" (segue para o diagnóstico) ou "pessoa_fisica" (vai ao Instagram)
      fbq("trackCustom", "filtro-empresa", { resposta:dados.resposta });
    } else if(evento === "inicio"){
      fbq("trackCustom", "InicioDiagnostico");
    } else if(evento === "lead"){
      // eventID permite deduplicar com a API de Conversões (o mesmo ID vai no webhook)
      fbq("track", CONFIG.rastreamento.eventoLead || "Lead",
        { content_name:"Diagnóstico SST", content_category:dados.classificacao, diagnostico_score:dados.score },
        { eventID:"lead_" + dados.lead_id });
    } else if(evento === "whatsapp"){
      fbq("track", "Contact", { content_name:"Diagnóstico SST", app:dados.app || "padrao" }, { eventID:"contato_" + dados.lead_id });
    }
  }catch(e){}
}

/* ---- Webhook / CRM (opcional). Nunca bloqueia nem quebra a experiência. ---- */
function enviarWebhook(evento){
  const url = CONFIG.rastreamento.webhookUrl;
  const L = estado.lead, R = estado.resultado;
  if(!url || !L || !R || L.robo) return;

  const fbc = lerCookie("_fbc") || (origem.fbclid ? "fb.1." + Date.now() + "." + origem.fbclid : "");
  const dados = {
    evento: evento,                                   // lead | diagnostico_refeito | whatsapp_click
    lead_id: estado.leadId,
    meta_event_id: "lead_" + estado.leadId,           // mesmo ID do evento Lead do Pixel
    data_hora: new Date().toISOString(),
    nome: L.nome,
    empresa: L.empresa,
    whatsapp: L.telefone ? "55" + L.telefone : "",
    email: L.email,
    consentimento_lgpd: "sim",
    consentimento_data: L.consentimentoEm,
    score: R.semFuncionarios ? "" : R.score,
    classificacao: R.semFuncionarios ? "Sem empregados CLT" : R.faixa.rotulo,
    qtd_pendencias: R.pendencias.length,
    pendencias_alta: R.pendencias.filter(p=> p.prioridade === "alta").length,
    pendencia_nr01_psicossocial: R.temPsicossocial ? "sim" : "nao",
    pendencias: R.pendencias.map(p=> p.titulo).join(" | "),
    funcionarios: rotuloOpcao("funcionarios", R.perfil.funcionarios),
    setor: rotuloOpcao("setor", R.perfil.setor),
    filtro: estado.filtro || "",
    utm_source: origem.utm_source || "", utm_medium: origem.utm_medium || "",
    utm_campaign: origem.utm_campaign || "", utm_content: origem.utm_content || "",
    utm_term: origem.utm_term || "", utm_id: origem.utm_id || "",
    fbclid: origem.fbclid || "", gclid: origem.gclid || "",
    fbp: lerCookie("_fbp"), fbc: fbc,
    pagina: location.href.split("#")[0],
    referrer: document.referrer,
    user_agent: navigator.userAgent,
  };
  // Detalhe completo (respostas e semáforo) em JSON, para quem quiser processar no Make/n8n
  dados.detalhes_json = JSON.stringify({
    respostas: R.respostas,
    areas: R.areas,
    pendencias: R.pendencias.map(p=> ({ titulo:p.titulo, prioridade:p.prioridade, area:p.area })),
  });

  try{
    if(CONFIG.rastreamento.webhookFormato === "json"){
      // Exige que o destino aceite CORS (ex.: Make aceita; alguns n8n precisam de configuração)
      fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(dados), keepalive:true }).catch(()=>{});
      return;
    }
    // Formulário (application/x-www-form-urlencoded): não sofre bloqueio de CORS
    const corpo = new URLSearchParams();
    Object.keys(dados).forEach(k=> corpo.append(k, dados[k] == null ? "" : String(dados[k])));
    const enviado = navigator.sendBeacon ? navigator.sendBeacon(url, corpo) : false;
    if(!enviado && window.fetch) fetch(url, { method:"POST", mode:"no-cors", body:corpo, keepalive:true }).catch(()=>{});
  }catch(e){ /* silencioso: o lead segue para o resultado e para o WhatsApp */ }
}

/* ==================================================================================================
   INICIALIZAÇÃO
   ================================================================================================== */
function aplicarMarca(){
  const m = CONFIG.marca, raiz = document.documentElement.style;
  if(m.verde) raiz.setProperty("--verde", m.verde);
  if(m.verdeEscuro) raiz.setProperty("--verde-escuro", m.verdeEscuro);
  if(m.azul) raiz.setProperty("--azul", m.azul);
}
function montarCabecalhoERodape(){
  const E = CONFIG.empresa;
  if(E.logoUrl){
    // Mostra a imagem da logo; se ela não carregar, volta para a logo em texto
    const $logo = document.getElementById("logo");
    const logoTexto = $logo.innerHTML;
    const img = new Image();
    img.alt = E.nome;
    img.onerror = ()=>{ $logo.innerHTML = logoTexto; };
    img.src = E.logoUrl;
    $logo.innerHTML = "";
    $logo.appendChild(img);
  }
  document.getElementById("rodapeEmpresa").textContent = E.nome + " · " + E.descricao;
  const extra = [];
  if(E.cnpj) extra.push("CNPJ " + esc(E.cnpj));
  if(E.site) extra.push('<a href="' + esc(E.site) + '" target="_blank" rel="noopener">' + esc(E.site.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")) + '</a>');
  if(E.politicaPrivacidadeUrl) extra.push('<a href="' + esc(E.politicaPrivacidadeUrl) + '" target="_blank" rel="noopener">Política de privacidade</a>');
  document.getElementById("rodapeExtra").innerHTML = extra.join(" · ");
}

aplicarMarca();
montarCabecalhoERodape();
iniciarRastreamento();
try{ history.replaceState({ tela:"hero", indice:0 }, ""); historicoOk = true; }catch(e){ historicoOk = false; }
render(false);
</script>
